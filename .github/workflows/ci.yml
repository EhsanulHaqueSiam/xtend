name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # The release workflow runs the same checks on the commit it ships.
  workflow_call:

permissions:
  contents: read

concurrency:
  # A release calling this runs in its own group, so a push's CI never cancels it.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runners are pinned: ubuntu-latest moved to 26.04 before Playwright supported it, and every
# run failed at the browser install.
jobs:
  # Skips the jobs a change cannot affect: docs alone run only `check`, root scripts alone skip
  # `build`. .github/scripts/ci-changes.cjs maps the changed paths to jobs. A pull request is
  # diffed against its base, a push to main against the commit before it. Detection fails open:
  # when the base cannot be read (a force push), everything runs.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.detect.outputs.build }}
      test: ${{ steps.detect.outputs.test }}
    steps:
      # A pull request checks out GitHub's merge commit; depth 2 brings its base as HEAD^1.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect affected jobs
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail

          decide() {
            node .github/scripts/ci-changes.cjs "$@" | tee -a "$GITHUB_OUTPUT"
            exit "${PIPESTATUS[0]}"
          }

          fail_open() {
            echo "$* Running every job."
            decide
          }

          # main keeps a full run as the backstop for whatever path gating missed.
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo "Push to main: running every job."
            decide
          fi
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base=HEAD^1
          else
            base=$BEFORE_SHA
            git fetch --quiet --no-tags --depth=1 --filter=blob:none origin "$base" \
              || fail_open "Could not fetch ${base}."
          fi

          # --no-renames lists a rename as its old and new path: moving a file out of a package
          # changes that package just like editing it.
          git diff --name-only --no-renames "$base" HEAD > "$RUNNER_TEMP/changed-paths" \
            || fail_open "Could not diff against ${base}."
          decide --paths "$RUNNER_TEMP/changed-paths"

  # No `needs`: it formats every file, docs included, so every change runs it.
  lint:
    name: Format, lint, unused code
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Reject committed PR evidence
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence is uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi
      - uses: ./.github/actions/setup
      - name: Reject X sessions and unscrubbed account data
        run: node scripts/check-no-x-session.ts
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm knip

  # A job skipped by its `if` reports success, so it still passes as a required check.
  # `!cancelled()` replaces the implicit success(): when `changes` fails, its outputs are empty,
  # not 'false', and the job runs instead of skipping.
  build:
    name: Build, typecheck, desktop smoke
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm build
      # The router plugin rewrites the route tree during the build; a stale committed copy
      # typechecks against routes that no longer exist.
      - name: Route tree is current
        run: git diff --exit-code -- apps/web/src/routeTree.gen.ts
      - name: Verify preload bundles
        run: pnpm --filter @xtend/desktop verify:bundles

      - name: Resolve Electron version
        id: electron
        run: echo "version=$(node -p "require('./apps/desktop/node_modules/electron/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Electron download
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.electron.outputs.version }}
      # pnpm-workspace.yaml disables Electron's install script; this fetches the binary.
      - run: pnpm --filter @xtend/desktop ensure:electron

      - name: Install a virtual display
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - name: Desktop smoke test
        run: xvfb-run -a pnpm --filter @xtend/desktop smoke-test

  test:
    name: Test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.test != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      # Web and desktop both run *.browser.test.* files in headless Chromium.
      - uses: ./.github/actions/chromium
      - run: pnpm test
      - run: pnpm test:e2e

  # The one check that sums up the run. A skipped job reports success, so this passes
  # only when every job passed or was skipped because `changes` said its gate was not needed, and
  # a cancelled run still fails. Add every new job to `needs`.
  check:
    name: Check
    if: ${{ always() }}
    needs: [changes, lint, build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.changes.outputs as $gates
            | all(to_entries[];
                .value.result == "success"
                or (.value.result == "skipped" and $gates[.key] == "false"))' > /dev/null
