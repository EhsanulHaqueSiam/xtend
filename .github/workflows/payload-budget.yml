name: Payload budget

# Fails when a PR raises a value in payloadBudget.json above main's. payloads.test.ts keeps that file
# equal to the measured WebSocket payloads, so a list cannot grow by editing the file. To accept
# growth on purpose (a field a screen needs), add the payload-increase label.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: payload-budget-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  budget:
    name: Payload budget
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BUDGET: apps/server/src/payloadBudget.json
      ALLOW_INCREASE: ${{ contains(github.event.pull_request.labels.*.name, 'payload-increase') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: apps/server/src/payloadBudget.json
          sparse-checkout-cone-mode: false

      - name: Compare with main
        run: |
          git fetch --quiet --depth=1 origin main
          if ! git cat-file -e "FETCH_HEAD:$BUDGET" 2>/dev/null; then
            echo "main has no payload budget yet."
            exit 0
          fi
          git show "FETCH_HEAD:$BUDGET" > "$RUNNER_TEMP/main.json"
          grown=$(jq -r --slurpfile main "$RUNNER_TEMP/main.json" '
            to_entries[]
            | select($main[0][.key] != null and .value > $main[0][.key])
            | "\(.key): \($main[0][.key]) -> \(.value) (+\(.value - $main[0][.key]))"
          ' "$BUDGET")
          if [ -z "$grown" ]; then
            echo "No payload is larger than on main."
            exit 0
          fi
          printf 'Payloads grew compared to main:\n%s\n' "$grown"
          if [ "$ALLOW_INCREASE" = "true" ]; then
            echo "Accepted by the payload-increase label."
            exit 0
          fi
          echo "::error file=$BUDGET::Payloads grew compared to main. Shrink the answer (cap the list, drop bodies) or, for a field a screen needs, add the payload-increase label."
          exit 1
