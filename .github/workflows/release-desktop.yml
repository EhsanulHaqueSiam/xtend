name: Release desktop

# A v* tag builds the macOS app and publishes a draft GitHub release with the dmg, the zip and
# latest-mac.yml for the updater. A manual run builds the same files as a workflow artifact only.
# Unsigned until the signing secrets exist; see apps/desktop/electron-builder.yml.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - run: pnpm build
      - run: pnpm --filter @xtend/desktop verify:bundles

      - name: Package
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        run: |
          # An empty CSC_LINK would make electron-builder look for a certificate that is not there.
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm exec electron-builder --mac --publish "$PUBLISH"

      - uses: actions/upload-artifact@v7
        with:
          name: xtend-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
