name: Release

# Two channels, as T3 Code ships them. Every push to main that touches the app is a nightly,
# X.Y.Z-nightly.YYYYMMDD.RUN where X.Y.Z is one patch past the last stable tag, published as a
# GitHub prerelease. A vX.Y.Z tag is a stable release, marked latest. Both carry latest-*.yml
# (electron-builder's GitHub publisher ignores the prerelease channel); a nightly app finds its
# release by the -nightly tag and electron-updater falls back to that release's latest-*.yml.
# Each builds the macOS app (dmg, zip), the Linux AppImage and the Windows installer for arm64 and
# x64, each on a runner of that OS and arch, plus the CLI tarball, checks them with the release
# smoke tests, and only then publishes. A manual run builds the same files as workflow artifacts
# and publishes nothing. The builds run beside CI's checks on the same commit, not after them, so
# a release takes the longer of the two, not their sum; nothing publishes until both pass. A
# stable tag must point at a commit on main. macOS builds are unsigned until the signing secrets
# exist (see apps/desktop/electron-builder.yml), so macOS installs link
# to the download instead of updating in place.
on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/release-desktop.yml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

# Merges in a row build only the newest nightly; a tag is never canceled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  version:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      nightly: ${{ steps.v.outputs.nightly }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # "behind" or "identical": the tagged commit is already on main.
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" -q .status)
            if [[ "$status" != behind && "$status" != identical ]]; then
              echo "$GITHUB_REF_NAME points at a commit that is not on main ($status)." >&2
              exit 1
            fi
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "nightly=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate -q '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1)
          IFS=. read -r major minor patch <<< "${last:-0.0.0}"
          echo "version=$major.$minor.$((patch + 1))-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "nightly=true" >> "$GITHUB_OUTPUT"

  # The platform-independent JS (service, web app, Electron main and preloads) is built once here,
  # so every desktop target ships the same bytes. The CLI tarball is that bundle too.
  bundle:
    name: Build JS bundle
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Stamp the version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          (cd apps/desktop && npm pkg set version="$VERSION")
          (cd apps/server && npm pkg set version="$VERSION")
      - run: pnpm build
      - name: Verify preload bundles
        run: pnpm --filter @xtend/desktop verify:bundles
      - uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/desktop/dist-electron
            apps/server/dist
            apps/web/dist
          retention-days: 1
          if-no-files-found: error
      - name: Pack and check the CLI
        run: pnpm cli:pack --check
      - uses: actions/upload-artifact@v7
        with:
          name: xtend-cli
          path: dist-cli/*.tgz
          if-no-files-found: error

  # One call per OS and arch, each built and verified on a runner of that kind
  # (.github/workflows/desktop.yml). All six start together once the bundle exists.
  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [version, bundle]
    uses: ./.github/workflows/desktop.yml
    secrets: inherit
    with:
      label: macOS arm64
      runner: macos-15
      os: mac
      arch: arm64
      version: ${{ needs.version.outputs.version }}

  desktop_mac_x64:
    name: Desktop macOS x64
    needs: [version, bundle]
    uses: ./.github/workflows/desktop.yml
    secrets: inherit
    with:
      label: macOS x64
      runner: macos-15-intel
      os: mac
      arch: x64
      version: ${{ needs.version.outputs.version }}

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [version, bundle]
    uses: ./.github/workflows/desktop.yml
    secrets: inherit
    with:
      label: Linux x64
      runner: ubuntu-24.04
      os: linux
      arch: x64
      version: ${{ needs.version.outputs.version }}

  desktop_linux_arm64:
    name: Desktop Linux arm64
    needs: [version, bundle]
    uses: ./.github/workflows/desktop.yml
    secrets: inherit
    with:
      label: Linux arm64
      runner: ubuntu-24.04-arm
      os: linux
      arch: arm64
      version: ${{ needs.version.outputs.version }}

  desktop_win_x64:
    name: Desktop Windows x64
    needs: [version, bundle]
    uses: ./.github/workflows/desktop.yml
    secrets: inherit
    with:
      label: Windows x64
      runner: windows-2025
      os: win
      arch: x64
      version: ${{ needs.version.outputs.version }}

  desktop_win_arm64:
    name: Desktop Windows arm64
    needs: [version, bundle]
    uses: ./.github/workflows/desktop.yml
    secrets: inherit
    with:
      label: Windows arm64
      runner: windows-11-arm
      os: win
      arch: arm64
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs:
      - version
      - checks
      - bundle
      - desktop_mac_arm64
      - desktop_mac_x64
      - desktop_linux_x64
      - desktop_linux_arm64
      - desktop_win_x64
      - desktop_win_arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only what ships: the per-target installers and feeds, and the CLI.
      - uses: actions/download-artifact@v8
        with:
          pattern: xtend-*
          path: artifacts
      # Both arches of macOS and of Windows write the same feed (latest-mac.yml, latest.yml).
      # electron-updater picks the file whose name holds the machine's arch, so one feed lists both.
      - name: Merge the update feeds
        run: |
          for os in mac win; do
            for feed in "artifacts/xtend-$os-x64"/*.yml; do
              other="artifacts/xtend-$os-arm64/$(basename "$feed")"
              [[ "$feed" == */builder-debug.yml || ! -f "$other" ]] && continue
              yq -i ".files += load(\"$other\").files" "$feed"
              rm "$other"
              echo "$(basename "$feed"): $(yq '.files[].url' "$feed" | tr '\n' ' ')"
            done
          done
      # Only builds that passed Verify get here. electron-builder also writes builder-debug.yml;
      # the updater reads only latest-*.yml. Each artifact is its own folder, so collect files.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          NIGHTLY: ${{ needs.version.outputs.nightly }}
        run: |
          mapfile -t files < <(find artifacts -type f ! -name builder-debug.yml)
          # Two targets writing one name would publish whichever came last.
          dupes=$(printf '%s\n' "${files[@]##*/}" | sort | uniq -d)
          if [ -n "$dupes" ]; then echo "Two builds wrote: $dupes" >&2; exit 1; fi
          if [ "$NIGHTLY" = true ]; then
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --title "Xtend $VERSION" --generate-notes "${files[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --latest \
              --title "Xtend $VERSION" --generate-notes "${files[@]}"
          fi
      # Push to release stays under ten minutes; this flags the change that breaks it.
      - name: Release time
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" -q .run_started_at)
          elapsed=$(( $(date +%s) - $(date -d "$started" +%s) ))
          echo "Released in $((elapsed / 60))m $((elapsed % 60))s." >> "$GITHUB_STEP_SUMMARY"
          if (( elapsed > 600 )); then
            echo "::warning::Release took $((elapsed / 60))m $((elapsed % 60))s, over the 10 minute budget."
          fi
