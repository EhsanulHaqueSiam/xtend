name: Setup
description: pnpm and Node at the repo's pinned versions, then the workspace dependencies from cache.
runs:
  using: composite
  steps:
    # Reads the version from package.json "packageManager". Pinned by commit: the release
    # workflow runs this with write access and the signing secrets.
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

    - uses: actions/setup-node@v5
      with:
        # Same pin as mise.toml.
        node-version: 26.11.1
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
