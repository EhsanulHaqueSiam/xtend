packages:
  - apps/*
  - packages/*

allowBuilds:
  # No install script since Electron 44; apps/desktop ensure:electron runs install.js.
  electron: false
  # Windows installer tooling; the macOS build never runs it.
  electron-winstaller: false
  esbuild: true
  tsc-rs: true

catalog:
  "@effect/atom-react": 4.0.5
  "@effect/language-service": 0.51.1
  "@effect/platform-node": 4.0.5
  "@effect/sql-sqlite-node": 4.0.5
  "@effect/vitest": 4.0.5
  "@tailwindcss/vite": 4.3.3
  "@tanstack/react-router": 1.160.2
  "@tanstack/router-plugin": 1.160.2
  "@types/node": 24.12.4
  "@types/react": ~19.3.0
  "@types/react-dom": ~19.3.0
  "@vitejs/plugin-react": 5.1.0
  effect: 4.0.5
  electron: 44.9.3
  react: 19.3.0
  react-dom: 19.3.0
  tailwindcss: 4.3.3
  typescript: 7.0.2
  vite-plus: 1.3.0

minimumReleaseAgeExclude:
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.308"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.308"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.308"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.308"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.308"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.308"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.308"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.308"
  - "@anthropic-ai/claude-agent-sdk@0.3.308"

overrides:
  "@effect/vitest": "catalog:"
  # @effect/vitest is patched to import vite-plus/test, so the vitest peer goes away.
  "@effect/vitest>vitest": "-"

packageExtensions:
  "@effect/vitest@*":
    dependencies:
      vite-plus: 1.3.0

patchedDependencies:
  "@effect/vitest@4.0.5": patches/@effect__vitest@4.0.5.patch
