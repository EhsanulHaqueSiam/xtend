# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews every PR once its GitHub App is installed on the repo; this file alone does
# nothing. The docs it holds code to are the same ones agents read.
reviews:
  high_level_summary: false
  review_status: false
  request_changes_workflow: false
  auto_review:
    enabled: true
  pre_merge_checks:
    docstrings:
      mode: "off"
  path_filters:
    - "!apps/web/src/routeTree.gen.ts"
    - "!pnpm-lock.yaml"
  path_instructions:
    - path: "{apps,packages}/**/*.ts"
      instructions: >-
        Hold changed code to docs/internals/effect-services.md. Flag any fetch, treg or X API call
        outside apps/server/src/x/, any token read outside apps/server/src/x/Treg.ts, and any
        handler that does more than decode, call one service method and map errors.
    - path: "apps/web/src/**/*.{tsx,css}"
      instructions: >-
        Hold changed code to docs/internals/design.md and AGENTS.md "Where code lives": shared
        pieces from components/ui before local ones, a page's sections from useSection (no
        own tab row), groups as a label and a hairline (no cards), no continuously repainting
        animation, long lists virtualized.
    - path: "{apps/desktop/src,apps/web/src/state,apps/web/src/components}/**"
      instructions: >-
        Xtend's session rule: the x.com session view writes (like, reply, repost, follow, vote,
        post, a menu row) only for an action the user just clicked, one at a time, and only while
        the session-actions setting is on. Flag a session write reachable from a timer, rule,
        agent, scheduler or effect, and any script injected into the session view beyond reading
        and pressing X's own buttons (the skin is CSS only). Flag a paid action (X API through
        treg, a model call) whose button does not show its cost before it runs.
    - path: "**/*.test.{ts,tsx}"
      instructions: >-
        Hold tests to docs/internals/testing.md. Ask for a missing test only when it would catch
        a real regression; flag tests that wait on sleeps, polling or timeouts, mirror the
        implementation, or repeat a case at a second layer.
knowledge_base:
  code_guidelines:
    filePatterns:
      - AGENTS.md
      - docs/internals/effect-services.md
      - docs/internals/testing.md
      - docs/internals/design.md
